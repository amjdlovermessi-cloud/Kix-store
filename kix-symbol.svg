<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" role="img" aria-labelledby="title">
  <title id="title">Geometric digital gateway symbol</title>
  <defs>
    <linearGradient id="frame" x1="17" y1="14" x2="84" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset=".52" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="core" x1="37" y1="32" x2="64" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4F7FC"/>
      <stop offset="1" stop-color="#A9DDF4"/>
    </linearGradient>
  </defs>
  <!-- Six-fold hexagonal frame, proportioned on a 12-unit construction grid. -->
  <path d="M50 7.5 86 28.25v43.5L50 92.5 14 71.75v-43.5L50 7.5Z"
        stroke="url(#frame)" stroke-width="5.5" stroke-linejoin="round"/>
  <!-- Modular inner gateway with a clear negative-space center. -->
  <path d="M34 36.5 50 27l16 9.5v27L50 73l-16-9.5v-27Z"
        stroke="url(#core)" stroke-width="4.5" stroke-linejoin="round"/>
  <path d="M34.5 50H44l6 6 6-6h9.5"
        stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M50 56V69" stroke="#34D399" stroke-width="4.5" stroke-linecap="round"/>
</svg>
name: Deploy Kix Store to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check project archive
        id: archive
        run: |
          if [ -f Kix-Store-Ready-to-Upload.zip ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Upload Kix-Store-Ready-to-Upload.zip to the repository root to enable deployment."
          fi
      - uses: actions/configure-pages@v5
        if: steps.archive.outputs.exists == 'true'
      - name: Extract website
        if: steps.archive.outputs.exists == 'true'
        run: |
          mkdir site
          unzip -q Kix-Store-Ready-to-Upload.zip -d site
          python security/patch_checkout.py site
          python security/patch_public_features.py site
          python security/patch_coupons.py site
          python security/patch_order_details.py site
          python - <<'PY'
          from pathlib import Path
          root = Path("site")
          for path in root.rglob("*"):
              if not path.is_file():
                  continue
              try:
                  data = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              updated = data.replace("WARBOY7", "kixstore1").replace("warboy7", "kixstore1")
              if updated != data:
                  path.write_text(updated, encoding="utf-8")
          PY
          if grep -Rni --exclude='*.map' 'WARBOY7\|warboy7' site; then
            echo "Old Telegram handle remains in deployed files."
            exit 1
          fi
          cp favicon.svg site/favicon.svg
          python - <<'PY'
          from pathlib import Path
          root = Path("site")
          tags = '''<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4">
          <link rel="shortcut icon" href="/favicon.svg?v=4">
          <link rel="apple-touch-icon" href="/favicon.svg?v=4">'''
          for page in root.rglob("*.html"):
              html = page.read_text(encoding="utf-8")
              if 'rel="icon"' in html or "rel='icon'" in html or 'rel="shortcut icon"' in html:
                  continue
              if "</head>" in html:
                  html = html.replace("</head>", tags + "\n</head>", 1)
                  page.write_text(html, encoding="utf-8")
          PY
          CONFIG_FILE="$(find site -type f -name config.js -print -quit)"
          if [ -z "$CONFIG_FILE" ]; then
            CONFIG_FILE="site/config.js"
          fi
          cat > "$CONFIG_FILE" <<'EOF'
          window.KIX_CONFIG = {
            supabaseUrl: 'https://xtewgkfwivdonaaozbkc.supabase.co',
            supabaseAnonKey: 'sb_publishable_auPgBHC9OjfYI8tMCkG0Jg_lJ0Uvh82',
            currency: 'IQD',
            whatsapp: '9647751689317',
            telegram: 'kixstore1'
          };
          EOF
      - uses: actions/upload-pages-artifact@v3
        if: steps.archive.outputs.exists == 'true'
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
        if: steps.archive.outputs.exists == 'true'
